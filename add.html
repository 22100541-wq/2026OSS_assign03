<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Travel</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="my.css" />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">My Travel List</a>
      </div>
    </nav>
    <main class="container py-5">
      <div class="card form-card shadow-sm">
        <div class="card-body p-4 p-md-5">
          <h1 class="h3 fw-bold mb-1">새로운 여행지 추가</h1>
          <p class="text-secondary mb-4">여행 계획을 입력해주세요.</p>
          <form action="index.html">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">여행지 이름 *</label
                ><input
                  class="form-control"
                  type="text"
                  name="destination"
                  required
                  minlength="2"
                  maxlength="30"
                  placeholder="예: Tokyo"
                />
              </div>
              <div class="col-md-6">
                <label class="form-label">국가 *</label>
                <input
                  class="form-control"
                  type="text"
                  required
                  minlength="2"
                  maxlength="30"
                  placeholder="예: Japan"
                />
              </div>
              <div class="col-md-6">
                <label class="form-label">도시 *</label
                ><input
                  class="form-control"
                  type="text"
                  name="city"
                  required
                  minlength="2"
                  maxlength="30"
                />
              </div>

              <div class="col-md-6">
                <label class="form-label">여행 날짜 *</label
                ><input class="form-control" type="date" name="date" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">여행 기간 (일) *</label
                ><input
                  class="form-control"
                  type="number"
                  name="days"
                  required
                  min="1"
                  max="30"
                />
              </div>
              <div class="col-md-6">
                <label class="form-label">여행 목적 *</label
                ><select class="form-select" name="purpose" required>
                  <option value="" selected disabled>목적 선택</option>
                  <option>관광</option>
                  <option>휴식</option>
                  <option>음식</option>
                  <option>쇼핑</option>
                  <option>출장</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">예상 비용 (원) *</label
                ><input
                  class="form-control"
                  type="number"
                  name="budget"
                  required
                  min="0"
                  max="100000000"
                  step="1"
                />
              </div>
              <div class="col-md-6">
                <label class="form-label">방문 상태 *</label
                ><select class="form-select" name="status" required>
                  <option value="" selected disabled>상태 선택</option>
                  <option>방문 예정</option>
                  <option>방문 완료</option>
                </select>
              </div>
            </div>
            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-primary">추가</button
              ><a href="index.html" class="btn btn-outline-secondary">취소</a>
            </div>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
